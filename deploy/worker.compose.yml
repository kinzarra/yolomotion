# Рендер-воркер на VPS (vibesrv): свой Postgres-очередь + один воркер.
# Запуск из корня чекаута на сервере:
#   docker compose -f deploy/worker.compose.yml --env-file .env_prod up -d --build
# Секреты — в .env_prod рядом (в образ не попадает, см. .dockerignore).
# Сервер общий с продом vbtnl: воркер ограничен по CPU/RAM, порты наружу не открыты.
name: yolomotion

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yolomotion
      POSTGRES_USER: yolomotion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yolomotion -d yolomotion"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    image: yolomotion-worker:latest
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    env_file: ../.env_prod
    environment:
      DATABASE_URL: postgresql://yolomotion:${POSTGRES_PASSWORD}@db:5432/yolomotion
      JOBS_DIR: /app/out/jobs
      RENDER_CONCURRENCY: "2"
    cpus: 2.5
    mem_limit: 6g
    volumes:
      - jobs:/app/out/jobs
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  jobs:
